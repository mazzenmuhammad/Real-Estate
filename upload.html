<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ارفع عقارك — NonReal Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#000;--white:#f5f5f7;--gray:#6e6e73;--blue:#2997ff;--border:rgba(255,255,255,0.12)}
body{background:var(--black);color:var(--white);font-family:'Inter','Cairo',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
nav{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:900}
.nav-logo{font-size:17px;font-weight:800;color:var(--white);text-decoration:none}
.nav-logo span{color:var(--blue)}
.nav-back{font-size:13px;color:var(--gray);text-decoration:none;transition:color 0.2s}
.nav-back:hover{color:var(--white)}

main{max-width:600px;margin:0 auto;padding:120px 24px 80px}
h1{font-size:clamp(36px,6vw,52px);font-weight:800;letter-spacing:-1.5px;margin-bottom:12px;text-align:center;font-family:'Inter',sans-serif}
.sub{font-size:18px;color:var(--gray);font-weight:300;text-align:center;margin-bottom:56px;line-height:1.6;font-family:'Cairo','Inter',sans-serif}

.form-card{background:#0a0a0a;border:1px solid var(--border);border-radius:18px;padding:40px;display:flex;flex-direction:column;gap:24px}
.field{display:flex;flex-direction:column;gap:8px}
label{font-size:13px;color:var(--gray);font-weight:500;letter-spacing:0.3px}
input,textarea,select{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--white);padding:14px 16px;border-radius:10px;
  font-family:'Cairo','Inter',sans-serif;font-size:15px;outline:none;
  transition:border-color 0.2s;width:100%
}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:100px;line-height:1.6}
select option{background:#111}

.drop-zone{
  border:2px dashed rgba(255,255,255,0.15);border-radius:12px;
  padding:40px;text-align:center;cursor:pointer;
  transition:all 0.2s;
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--blue);background:rgba(41,151,255,0.05)}
.drop-icon{font-size:36px;margin-bottom:12px;display:block}
.drop-text{font-size:15px;color:var(--gray);line-height:1.5}
.drop-text span{color:var(--blue)}
#file-input{display:none}
#file-name{font-size:13px;color:var(--blue);margin-top:10px;min-height:18px}

.submit-btn{
  background:var(--blue);color:#fff;
  padding:16px;border:none;border-radius:980px;
  font-size:17px;font-weight:600;cursor:pointer;
  font-family:'Inter','Cairo',sans-serif;
  transition:opacity 0.2s;margin-top:8px;
}
.submit-btn:hover{opacity:0.85}

.success{display:none;text-align:center;padding:60px 0}
.success h2{font-size:32px;font-weight:800;margin-bottom:12px;font-family:'Inter',sans-serif}
.success p{font-size:17px;color:var(--gray);font-family:'Cairo','Inter',sans-serif}
.success a{display:inline-block;margin-top:32px;color:var(--blue);text-decoration:none;font-size:15px}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo" id="ul-logo">NON<span>REAL</span> ESTATE</a>
  <a href="index.html" class="nav-back">← رجوع</a>
</nav>

<main>
  <div id="form-section">
    <h1>ابدأ مشروعك</h1>
    <p class="sub">أرسل تفاصيل عقارك وسنتواصل معك خلال 24 ساعة.</p>

    <div class="form-card">
      <div class="field">
        <label>اسمك الكريم</label>
        <input type="text" id="f-name" placeholder="محمد أحمد">
      </div>
      <div class="field">
        <label>رقم واتساب</label>
        <input type="text" id="f-phone" placeholder="201xxxxxxxxx+">
      </div>
      <div class="field">
        <label>اسم العقار أو الموقع</label>
        <input type="text" id="f-prop" placeholder="شقة — القاهرة الجديدة">
      </div>
      <div class="field">
        <label>الباقة المطلوبة</label>
        <select id="f-plan">
          <option value="">اختر باقة...</option>
          <option value="starter">Starter — 1,000 ج.م</option>
          <option value="pro">Pro — 2,500 ج.م</option>
          <option value="agency">Agency — 6,000 ج.م</option>
        </select>
      </div>
      <div class="field">
        <label>المخطط أو الملفات (اختياري)</label>
        <div class="drop-zone" onclick="document.getElementById('file-input').click()"
          ondragover="event.preventDefault();this.classList.add('drag')"
          ondragleave="this.classList.remove('drag')"
          ondrop="handleDrop(event)">
          <span class="drop-icon">📎</span>
          <div class="drop-text">اسحب الملفات هنا أو <span>اضغط للاختيار</span></div>
          <div id="file-name"></div>
        </div>
        <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.glb,.obj" multiple onchange="showFile(this)">
      </div>
      <div class="field">
        <label>ملاحظات إضافية</label>
        <textarea id="f-notes" placeholder="أي تفاصيل تحب تضيفها..."></textarea>
      </div>
      <button class="submit-btn" onclick="submitForm()">إرسال الطلب →</button>
    </div>
  </div>

  <div class="success" id="success-section">
    <div style="font-size:56px;margin-bottom:20px">✓</div>
    <h2>تم إرسال طلبك!</h2>
    <p>سنتواصل معك على واتساب خلال 24 ساعة.</p>
    <a href="index.html">← العودة للرئيسية</a>
  </div>
</main>

<script>
// Apply logo from settings
try{
  const s=JSON.parse(localStorage.getItem('nre3')||'{}');
  const logo=document.getElementById('ul-logo');
  const imgData=localStorage.getItem('nre_logo_img');
  if(imgData){logo.innerHTML=`<img src="${imgData}" style="height:26px">`;} 
  else if(s.logoText){const f=s.logoText.toUpperCase(),h=(s.logoHighlight||'REAL').toUpperCase(),i=f.indexOf(h);logo.innerHTML=i>=0?f.slice(0,i)+'<span style="color:var(--blue)">'+h+'</span>'+f.slice(i+h.length):f;}
}catch(e){}

function showFile(inp){
  const names=Array.from(inp.files).map(f=>f.name).join(', ');
  document.getElementById('file-name').textContent=names;
}
function handleDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag');
  const dt=e.dataTransfer;
  if(dt.files.length){document.getElementById('file-input').files=dt.files;showFile(document.getElementById('file-input'));}
}

function submitForm(){
  const name=document.getElementById('f-name').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const prop=document.getElementById('f-prop').value.trim();
  const plan=document.getElementById('f-plan').value;
  const notes=document.getElementById('f-notes').value.trim();
  if(!name||!phone){alert('الرجاء إدخال الاسم ورقم الواتساب');return;}
  
  let s={wa:'201000000000'};
  try{Object.assign(s,JSON.parse(localStorage.getItem('nre3')||'{}'));}catch(e){}
  
  const msg = `*طلب جديد — NonReal Estate*%0A%0A👤 الاسم: ${encodeURIComponent(name)}%0A📱 الهاتف: ${encodeURIComponent(phone)}%0A🏢 العقار: ${encodeURIComponent(prop||'—')}%0A💼 الباقة: ${encodeURIComponent(plan||'—')}%0A📝 ملاحظات: ${encodeURIComponent(notes||'—')}`;
  window.open(`https://wa.me/${s.wa}?text=${msg}`,'_blank');
  document.getElementById('form-section').style.display='none';
  document.getElementById('success-section').style.display='block';
}
</script>
</body>
</html>
